<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" role="img" aria-labelledby="title desc"><title id="title">Três responsabilidades na mesma mudança</title><desc id="desc">Solicitação passa por autoridade de decisão, executor com recursos e responsável por acompanhamento. Desvio reabre decisão; executor não recebe automaticamente autoridade para aceitar risco.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="710" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Três responsabilidades na mesma mudança</tspan></text><rect x="110" y="88" width="380" height="62" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="300.0" y="126.04" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Solicitação de mudança</tspan></text><path d="M300 150 L300 198" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="182" fill="#006b68" font-size="20" font-weight="700" text-anchor="start"><tspan x="35" dy="0">Quem decide?</tspan></text><rect x="90" y="210" width="420" height="86" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="300.0" y="245.73999999999998" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Gestor do processo</tspan><tspan x="300.0" dy="28.6">ou autoridade de exceção</tspan></text><path d="M300 295 L300 343" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="327" fill="#006b68" font-size="20" font-weight="700" text-anchor="start"><tspan x="35" dy="0">Quem executa?</tspan></text><rect x="90" y="355" width="420" height="86" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="300.0" y="390.74" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">TI e fornecedor</tspan><tspan x="300.0" dy="28.6">com permissão e recurso</tspan></text><path d="M300 440 L300 488" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="472" fill="#006b68" font-size="20" font-weight="700" text-anchor="start"><tspan x="35" dy="0">Quem acompanha?</tspan></text><rect x="90" y="500" width="420" height="86" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="300.0" y="535.74" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Responsável designado</tspan><tspan x="300.0" dy="28.6">confere evidência e desvio</tspan></text><path d="M510 543 L558 543 L558 184 L490 184" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="657" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Sem autoridade ou recurso: escalar.</tspan><tspan x="300" dy="26.0">Executar uma ação não significa poder aceitar o risco.</tspan></text></g></svg>