<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" role="img" aria-labelledby="title desc"><title id="title">Da evidência ao cenário de risco</title><desc id="desc">R01: ocorrências na amostra sustentam condição que permanece; cenário possível é nova publicação indevida; consequência é divulgação comercial. Destinatários e alcance são desconhecidos.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="670" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Da evidência ao cenário de risco</tspan></text><text x="300" y="88" fill="#42566b" font-size="21" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">R01 · exemplo de publicação interna</tspan></text><rect x="35" y="120" width="530" height="82" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="300.0" y="154.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">EVIDÊNCIA</tspan><tspan x="300.0" dy="26.0">Duas publicações internas na amostra</tspan></text><path d="M300 202 L300 231" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="238" width="530" height="82" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="300.0" y="272.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">CONDIÇÃO</tspan><tspan x="300.0" dy="26.0">A aprovação de conteúdo não mudou</tspan></text><path d="M300 320 L300 349" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="356" width="530" height="82" rx="12" fill="#fff4df" stroke="#865000" stroke-width="2"/><text x="300.0" y="390.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">EVENTO POSSÍVEL</tspan><tspan x="300.0" dy="26.0">Outra publicação chega a pessoa não autorizada</tspan></text><path d="M300 438 L300 467" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="474" width="530" height="82" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="300.0" y="508.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">CONSEQUÊNCIA</tspan><tspan x="300.0" dy="26.0">Informação comercial é divulgada</tspan></text><text x="300" y="615" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Incerteza: quem acessou e qual foi o alcance?</tspan><tspan x="300" dy="26.0">A amostra não fornece uma probabilidade de ataque.</tspan></text></g></svg>