<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc"><title id="title">Onde o pedido precisa parar</title><desc id="desc">Sem autoridade confirmada, pedido permanece pendente e o acesso não é liberado. Com autoridade, registrar decisão; executar somente se aprovado e conferir encerramento.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#31556c" stroke-width="1.4"/></marker></defs><rect width="600" height="800" rx="16" fill="#f7f9fc"/><text x="300" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#17324d" font-weight="700"><tspan x="300" dy="0">Onde o pedido precisa parar</tspan></text><rect x="70" y="80" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">Pedido de manutenção</tspan></text><path d="M300 175 V205" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="210" width="460" height="95" rx="12" fill="#fff4df" stroke="#31556c" stroke-width="2"/><text x="300.0" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">Há autoridade confirmada</tspan><tspan x="300.0" dy="31">para decidir?</tspan></text><path d="M165 305 V360" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><path d="M435 305 V360" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="91.0" y="320" width="148" height="25" fill="#f7f9fc"/><text x="165" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d" font-weight="400"><tspan x="165" dy="0">NÃO: caso G03</tspan></text><rect x="410.0" y="320" width="50" height="25" fill="#f7f9fc"/><text x="435" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d" font-weight="400"><tspan x="435" dy="0">SIM</tspan></text><rect x="30" y="365" width="265" height="125" rx="12" fill="#fff4df" stroke="#31556c" stroke-width="2"/><text x="162.5" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="162.5" dy="0">PENDENTE</tspan><tspan x="162.5" dy="31">Encaminhar;</tspan><tspan x="162.5" dy="31">não liberar</tspan></text><rect x="320" y="365" width="250" height="125" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="445.0" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="445.0" dy="0">Registrar</tspan><tspan x="445.0" dy="31">a decisão</tspan></text><path d="M445 490 V540" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="382.5" y="505" width="125" height="25" fill="#f7f9fc"/><text x="445" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d" font-weight="400"><tspan x="445" dy="0">Se aprovado</tspan></text><rect x="320" y="545" width="250" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="445.0" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="445.0" dy="0">Executar acesso</tspan><tspan x="445.0" dy="31">delimitado</tspan></text><path d="M445 640 V675" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="680" width="250" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="445.0" y="716" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="445.0" dy="0">Conferir fim</tspan><tspan x="445.0" dy="31">e guardar registro</tspan></text></svg>