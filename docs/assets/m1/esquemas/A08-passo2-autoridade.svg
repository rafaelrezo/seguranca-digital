<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 555" role="img" aria-labelledby="title desc"><title id="title">Da política à ação autorizada</title><desc id="desc">Direção aprova política e recursos. Autoridade designada decide sobre acesso; TI executa. Se o aprovador estiver ausente, encaminhar a substituto autorizado.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#31556c" stroke-width="1.4"/></marker></defs><rect width="600" height="555" rx="16" fill="#f7f9fc"/><text x="300" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#17324d" font-weight="700"><tspan x="300" dy="0">Da política à ação autorizada</tspan></text><rect x="70" y="80" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">Direção</tspan><tspan x="300.0" dy="31">Aprovar política e recursos</tspan></text><path d="M300 175 V205" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="210" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">Autoridade designada</tspan><tspan x="300.0" dy="31">Decidir sobre o acesso</tspan></text><path d="M300 305 V335" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="340" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">TI</tspan><tspan x="300.0" dy="31">Executar a decisão e registrar</tspan></text><text x="300" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17324d" font-weight="400"><tspan x="300" dy="0">Aprovador ausente? Encaminhar</tspan><tspan x="300" dy="31">a um substituto autorizado.</tspan></text></svg>