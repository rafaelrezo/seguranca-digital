<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">Serviço incluído, empresa externa</title><desc id="desc">O escopo do SGSI inclui portal, pedidos, documentos e a atividade de manutenção contratada. Suporte Norte é a empresa externa que presta essa atividade, indicada por seta para dentro do escopo.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#31556c" stroke-width="1.5"/></marker></defs><rect width="600" height="600" rx="16" fill="#f7f9fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><text x="300" y="40" font-size="25" font-weight="700">Serviço incluído, empresa externa</text><rect x="35" y="80" width="530" height="330" rx="14" fill="white" stroke="#006b68" stroke-width="3" stroke-dasharray="8 5"/><text x="300" y="117" font-size="22" font-weight="700">ESCOPO DO SGSI (proposto)</text><rect x="70" y="145" width="460" height="95" rx="10" fill="#eaf4f4" stroke="#31556c"/><text x="300" y="181" font-size="24"><tspan x="300">Portal, pedidos e documentos</tspan><tspan x="300" dy="32">Trabalho de comercial e TI</tspan></text><path d="M300 285 V245" stroke="#31556c" stroke-width="3" marker-end="url(#a)"/><rect x="70" y="290" width="460" height="95" rx="10" fill="#eaf4f4" stroke="#31556c"/><text x="300" y="327" font-size="24"><tspan x="300">Manutenção contratada do portal</tspan><tspan x="300" dy="32">Atividade abrangida pelo SGSI</tspan></text><path d="M300 490 V392" stroke="#31556c" stroke-width="3" marker-end="url(#a)"/><text x="442" y="451" font-size="21">presta o serviço</text><rect x="70" y="495" width="460" height="85" rx="10" fill="#edf2fc" stroke="#31556c"/><text x="300" y="529" font-size="24"><tspan x="300">Suporte Norte</tspan><tspan x="300" dy="31">Empresa fornecedora externa</tspan></text></g></svg>