<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">O serviço e sua dependência</title><desc id="desc">Comercial e TI trabalham com pedidos, documentos e portal. Suporte Norte presta manutenção externa a esse serviço.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#31556c" stroke-width="1.4"/></marker></defs><rect width="600" height="490" rx="16" fill="#f7f9fc"/><text x="300" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#17324d" font-weight="700"><tspan x="300" dy="0">O serviço e sua dependência</tspan></text><rect x="35" y="80" width="530" height="230" rx="12" fill="white" stroke="#006b68" stroke-width="3" stroke-dasharray="8 5"/><text x="300" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#17324d" font-weight="700"><tspan x="300" dy="0">ESCOPO PROPOSTO</tspan></text><text x="300" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300" dy="0">Comercial e TI</tspan><tspan x="300" dy="31">Pedidos, documentos e portal</tspan></text><text x="300" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#17324d" font-weight="400"><tspan x="300" dy="0">Serviço usado pelos clientes</tspan></text><rect x="70" y="380" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">Suporte Norte</tspan><tspan x="300.0" dy="31">Empresa contratada</tspan></text><path d="M300 380 V318" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><text x="437" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17324d" font-weight="400"><tspan x="437" dy="0">manutenção</tspan></text></svg>