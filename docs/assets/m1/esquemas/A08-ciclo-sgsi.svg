<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title desc"><title id="title">Uma correção precisa continuar funcionando</title><desc id="desc">Ciclo: definir regra e responsável, executar e registrar, acompanhar resultado, rever decisão e recursos. Mudanças reabrem o ciclo.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="510" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Uma correção precisa continuar funcionando</tspan></text><text x="300" y="83" fill="#42566b" font-size="19" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">O teste fecha um caso. A gestão acompanha as mudanças.</tspan></text><rect x="45" y="125" width="225" height="90" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="157.5" y="162.73999999999998" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="157.5" dy="0">Definir regra</tspan><tspan x="157.5" dy="28.6">e responsável</tspan></text><rect x="330" y="125" width="225" height="90" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="442.5" y="162.73999999999998" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="442.5" dy="0">Executar</tspan><tspan x="442.5" dy="28.6">e registrar</tspan></text><rect x="330" y="315" width="225" height="90" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="442.5" y="352.74" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="442.5" dy="0">Acompanhar</tspan><tspan x="442.5" dy="28.6">o resultado</tspan></text><rect x="45" y="315" width="225" height="90" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="157.5" y="352.74" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="157.5" dy="0">Rever decisão</tspan><tspan x="157.5" dy="28.6">e recursos</tspan></text><path d="M270 170 L325 170" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><path d="M442 215 L442 310" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><path d="M330 360 L275 360" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><path d="M157 315 L157 220" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="267" fill="#006b68" font-size="32" font-weight="700" text-anchor="middle"><tspan x="300" dy="0">SGSI</tspan></text><text x="300" y="452" fill="#17324d" font-size="21" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Nova publicação, pessoa ou fornecedor?</tspan><tspan x="300" dy="27.3">Reabrir a decisão e conferir a regra.</tspan></text></g></svg>