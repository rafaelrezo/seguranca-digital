<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 575" role="img" aria-labelledby="title desc"><title id="title">Aprovar não comprova redução de risco</title><desc id="desc">Tratamento proposto possui residual estimado; implantação gera evidência de mudança; avaliação permite revisar risco com limites. Mudança de premissa ou desvio reabre decisão.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="575" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Aprovar não comprova redução de risco</tspan></text><rect x="105" y="90" width="390" height="78" rx="12" fill="#fff4df" stroke="#865000" stroke-width="2"/><text x="300.0" y="122.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">1 · TRATAMENTO PROPOSTO</tspan><tspan x="300.0" dy="26.0">Residual estimado depende de premissas</tspan></text><path d="M300 168 L300 218" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="202" fill="#42566b" font-size="18" font-weight="400" text-anchor="start"><tspan x="320" dy="0">executar e registrar</tspan></text><rect x="105" y="235" width="390" height="78" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="300.0" y="267.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">2 · MEDIDA IMPLANTADA</tspan><tspan x="300.0" dy="26.0">Há evidência da mudança</tspan></text><path d="M300 313 L300 363" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="347" fill="#42566b" font-size="18" font-weight="400" text-anchor="start"><tspan x="320" dy="0">avaliar a operação</tspan></text><rect x="105" y="380" width="390" height="78" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="300.0" y="412.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">3 · RESULTADO AVALIADO</tspan><tspan x="300.0" dy="26.0">Revisar o risco com evidência e limites</tspan></text><path d="M105 420 L45 420 L45 129 L98 129" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="520" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Mudou a premissa ou surgiu desvio?</tspan><tspan x="300" dy="26.0">Reabrir a decisão, mesmo antes da revisão periódica.</tspan></text></g></svg>