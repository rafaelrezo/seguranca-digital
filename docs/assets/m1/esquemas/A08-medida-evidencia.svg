<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">O denominador muda a interpretação</title><desc id="desc">Seis autorizações: cinco vencidas, quatro com comprovação de encerramento e uma sem comprovação; a sexta vigente fica fora do cálculo. Quatro dividido por cinco é oitenta por cento, sem provar abuso.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="610" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">O denominador muda a interpretação</tspan></text><text x="300" y="88" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">G04 · seis autorizações examinadas</tspan></text><rect x="25" y="115" width="550" height="232" rx="12" fill="white" stroke="#165da6" stroke-width="2"/><text x="300" y="148" fill="#165da6" font-size="22" font-weight="700" text-anchor="middle"><tspan x="300" dy="0">Cinco venceram: este é o denominador</tspan></text><circle cx="85" cy="207" r="32" fill="#006b68" stroke="#006b68" stroke-width="2"/><text x="85" y="216" fill="white" font-size="28" font-weight="700" text-anchor="middle"><tspan x="85" dy="0">✓</tspan></text><circle cx="192" cy="207" r="32" fill="#006b68" stroke="#006b68" stroke-width="2"/><text x="192" y="216" fill="white" font-size="28" font-weight="700" text-anchor="middle"><tspan x="192" dy="0">✓</tspan></text><circle cx="299" cy="207" r="32" fill="#006b68" stroke="#006b68" stroke-width="2"/><text x="299" y="216" fill="white" font-size="28" font-weight="700" text-anchor="middle"><tspan x="299" dy="0">✓</tspan></text><circle cx="406" cy="207" r="32" fill="#006b68" stroke="#006b68" stroke-width="2"/><text x="406" y="216" fill="white" font-size="28" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">✓</tspan></text><circle cx="513" cy="207" r="32" fill="#fff4df" stroke="#865000" stroke-width="2"/><text x="513" y="216" fill="#865000" font-size="28" font-weight="700" text-anchor="middle"><tspan x="513" dy="0">?</tspan></text><text x="245" y="277" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="245" dy="0">4 com encerramento</tspan><tspan x="245" dy="26.0">comprovado</tspan></text><text x="500" y="277" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">1 sem</tspan><tspan x="500" dy="26.0">comprovação</tspan></text><rect x="60" y="376" width="480" height="72" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="300.0" y="405.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">A sexta ainda está vigente:</tspan><tspan x="300.0" dy="26.0">prorrogação aprovada → fora do denominador</tspan></text><text x="300" y="509" fill="#006b68" font-size="36" font-weight="700" text-anchor="middle"><tspan x="300" dy="0">4 ÷ 5 = 80%</tspan></text><text x="300" y="553" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Mede comprovação entre autorizações vencidas.</tspan><tspan x="300" dy="26.0">Não prova uso indevido da autorização restante.</tspan></text></g></svg>