<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">Da evidência à medida candidata</title><desc id="desc">Falta comprovação de encerramento. Acesso disponível é uma pergunta; uso fora do prazo é risco candidato. Atribuir encerramento é uma proposta.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#31556c" stroke-width="1.4"/></marker></defs><rect width="600" height="620" rx="16" fill="#f7f9fc"/><text x="300" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#17324d" font-weight="700"><tspan x="300" dy="0">Da evidência à medida candidata</tspan></text><rect x="70" y="80" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">FORNECIDO</tspan><tspan x="300.0" dy="31">Falta comprovação de encerramento</tspan></text><path d="M300 175 V205" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="210" width="460" height="95" rx="12" fill="#fff4df" stroke="#31556c" stroke-width="2"/><text x="300.0" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">A VERIFICAR</tspan><tspan x="300.0" dy="31">O acesso continua disponível?</tspan></text><path d="M300 305 V335" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="340" width="460" height="95" rx="12" fill="#fff4df" stroke="#31556c" stroke-width="2"/><text x="300.0" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">RISCO CANDIDATO</tspan><tspan x="300.0" dy="31">Uso fora do prazo</tspan></text><path d="M300 435 V465" fill="none" stroke="#31556c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="470" width="460" height="95" rx="12" fill="#eaf4f4" stroke="#31556c" stroke-width="2"/><text x="300.0" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17324d" font-weight="400"><tspan x="300.0" dy="0">PROPOSTA</tspan><tspan x="300.0" dy="31">Atribuir e comprovar encerramento</tspan></text><text x="300" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17324d" font-weight="400"><tspan x="300" dy="0">Uso indevido não foi confirmado.</tspan></text></svg>