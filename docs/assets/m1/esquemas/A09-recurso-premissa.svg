<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" role="img" aria-labelledby="title desc"><title id="title">Uma soma viável ainda depende de condições</title><desc id="desc">Barras proporcionais mostram C1 duas horas e C3 seis horas, total oito. A combinação cabe no esforço, mas depende de supervisor e aprovação; sem supervisor, a decisão deve ser revista.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="690" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Uma soma viável ainda depende de condições</tspan></text><text x="300" y="86" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Oito horas disponíveis antes da janela</tspan></text><text x="35" y="140" fill="#17324d" font-size="21" font-weight="700" text-anchor="start"><tspan x="35" dy="0">C1 · publicação interna</tspan></text><rect x="35" y="161" width="132" height="52" rx="6" fill="#006b68"/><text x="101" y="195" fill="white" font-size="25" font-weight="700" text-anchor="middle"><tspan x="101" dy="0">2h</tspan></text><text x="35" y="255" fill="#17324d" font-size="21" font-weight="700" text-anchor="start"><tspan x="35" dy="0">C3 · manutenção acompanhada</tspan></text><rect x="35" y="276" width="396" height="52" rx="6" fill="#165da6"/><text x="233" y="310" fill="white" font-size="25" font-weight="700" text-anchor="middle"><tspan x="233" dy="0">6h</tspan></text><text x="35" y="372" fill="#17324d" font-size="21" font-weight="700" text-anchor="start"><tspan x="35" dy="0">C1 + C3 · cabe no esforço disponível</tspan></text><rect x="35" y="393" width="132" height="52" fill="#006b68"/><rect x="167" y="393" width="396" height="52" fill="#165da6"/><text x="101" y="427" fill="white" font-size="25" font-weight="700" text-anchor="middle"><tspan x="101" dy="0">2h</tspan></text><text x="365" y="427" fill="white" font-size="25" font-weight="700" text-anchor="middle"><tspan x="365" dy="0">6h</tspan></text><path d="M300 454 L300 491" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="505" width="530" height="96" rx="12" fill="#fff4df" stroke="#865000" stroke-width="2"/><text x="300.0" y="546.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Mas C3 depende de supervisor e aprovação.</tspan><tspan x="300.0" dy="26.0">Sem supervisor, a decisão precisa ser reaberta.</tspan></text><text x="300" y="645" fill="#865000" font-size="22" font-weight="700" text-anchor="middle"><tspan x="300" dy="0">Viabilidade de horas ≠ prontidão operacional.</tspan></text></g></svg>