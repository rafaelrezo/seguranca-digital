<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" role="img" aria-labelledby="title desc"><title id="title">O escopo inclui decisões e interfaces</title><desc id="desc">Fornecedor externo se relaciona por solicitação e aprovação com o escopo dos pedidos digitais. Comercial define regra, TI aplica mudança e portal mantém informação. Intervenção na operação exige autorização própria.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="710" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">O escopo inclui decisões e interfaces</tspan></text><rect x="175" y="85" width="250" height="68" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="300.0" y="126.04" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Suporte Norte</tspan></text><path d="M300 153 L300 218" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><text x="315" y="185" fill="#42566b" font-size="18" font-weight="400" text-anchor="start"><tspan x="315" dy="0">solicitação</tspan><tspan x="315" dy="23.400000000000002">e aprovação</tspan></text><rect x="30" y="225" width="540" height="270" rx="16" fill="white" stroke="#006b68" stroke-width="3" stroke-dasharray="8 5"/><text x="50" y="260" fill="#006b68" font-size="21" font-weight="700" text-anchor="start"><tspan x="50" dy="0">ESCOPO: pedidos digitais da Nuvora</tspan></text><rect x="55" y="292" width="220" height="78" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="165.0" y="323.74" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="165.0" dy="0">Comercial</tspan><tspan x="165.0" dy="28.6">finalidade e regra</tspan></text><rect x="325" y="292" width="220" height="78" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="435.0" y="323.74" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="435.0" dy="0">TI</tspan><tspan x="435.0" dy="28.6">identidade e mudança</tspan></text><path d="M275 332 L320 332" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="408" width="300" height="60" rx="12" fill="#eaf4f4" stroke="#006b68" stroke-width="2"/><text x="300.0" y="445.04" fill="#17324d" font-size="22" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Portal + informação</tspan></text><path d="M437 370 L437 391" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><path d="M437 391 L300 391 L300 403" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="548" width="440" height="70" rx="12" fill="#fff4df" stroke="#865000" stroke-width="2"/><text x="300.0" y="576.4" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Operação de embalagem</tspan><tspan x="300.0" dy="26.0">intervenção exige autorização própria</tspan></text><path d="M300 495 L300 542" fill="none" stroke="#42566b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="300" y="659" fill="#17324d" font-size="19" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Fora da equipe ≠ fora da gestão da dependência.</tspan><tspan x="300" dy="24.7">O desenho não demonstra um caminho de invasão.</tspan></text></g></svg>