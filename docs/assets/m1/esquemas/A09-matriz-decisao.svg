<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">A matriz orienta o encaminhamento</title><desc id="desc">Matriz didática de consequência e plausibilidade. R01 com consequência relevante e plausibilidade alta pede tratamento prioritário. A matriz não substitui justificativa ou avaliação operacional.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs><rect width="600" height="610" rx="18" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#17324d" font-size="25" font-weight="700" text-anchor="start"><tspan x="30" dy="0">A matriz orienta o encaminhamento</tspan></text><text x="345" y="87" fill="#165da6" font-size="19" font-weight="700" text-anchor="middle"><tspan x="345" dy="0">PLAUSIBILIDADE →</tspan></text><text x="240" y="124" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="240" dy="0">Baixa</tspan></text><text x="377" y="124" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="377" dy="0">Média</tspan></text><text x="514" y="124" fill="#17324d" font-size="20" font-weight="400" text-anchor="middle"><tspan x="514" dy="0">Alta</tspan></text><text x="20" y="202" fill="#17324d" font-size="19" font-weight="700" text-anchor="start"><tspan x="20" dy="0">Grave</tspan></text><rect x="175" y="150" width="128" height="91" rx="12" fill="#edf2fc" stroke="#165da6" stroke-width="2"/><text x="239.0" y="189.89" fill="#17324d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="239.0" dy="0">Avaliar com</tspan><tspan x="239.0" dy="22.1">gestor</tspan></text><rect x="312" y="150" width="128" height="91" rx="12" fill="#fff0de" stroke="#865000" stroke-width="2"/><text x="376.0" y="189.89" fill="#17324d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="376.0" dy="0">Tratar co