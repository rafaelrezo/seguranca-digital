<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
<title id="title">Zonas da indústria didática e controles de acesso</title>
<desc id="desc">Da esquerda para a direita: área externa, recepção controlada, sala de engenharia restrita e processo OT fora do escopo da aula. Barreiras numeradas: portaria, porta de engenharia e fronteira OT. A visita SV-104 termina na recepção.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#164e77"/></marker></defs>
<rect width="1100" height="370" fill="#f7f9fc"/>
<g font-family="Arial,sans-serif" fill="#17324d">
<rect x="22" y="58" width="200" height="210" rx="10" fill="#f3f5f7" stroke="#657587" stroke-width="2"/><text x="42" y="96" font-size="21" font-weight="700">Área externa</text><text x="42" y="135" font-size="16">Pedido e crachá</text><text x="42" y="163" font-size="16">são apresentados.</text>
<rect x="275" y="58" width="235" height="210" rx="10" fill="#e7f6ee" stroke="#38845d" stroke-width="2"/><text x="295" y="96" font-size="21" font-weight="700">Recepção</text><text x="295" y="135" font-size="16">Impressora SV-104</text><text x="295" y="163" font-size="16">Ana acompanha.</text><text x="295" y="212" font-size="16" fill="#1f6441">Aprovada para Marta</text>
<rect x="565" y="58" width="235" height="210" rx="10" fill="#fff1db" stroke="#c47b00" stroke-width="2"/><text x="585" y="96" font-size="21" font-weight="700">Engenharia</text><text x="585" y="135" font-size="16">Estações e arquivos</text><text x="585" y="163" font-size="16">de configuração.</text><text x="585" y="212" font-size="16" fill="#8c5100">SV-104 não autoriza</text>
<rect x="855" y="58" width="220" height="210" rx="10" fill="#f0eafa" stroke="#785a9e" stroke-width="2"/><text x="875" y="96" font-size="21" font-weight="700">Processo OT</text><text x="875" y="135" font-size="16">Função e risco físico</text><text x="875" y="163" font-size="16">serão estudados depois.</text><text x="875" y="212" font-size="16" fill="#644781">Fora do exercício</text>
<text x="233" y="38" font-size="17" font-weight="700">Portaria</text><text x="520" y="38" font-size="17" font-weight="700">Porta restrita</text><text x="808" y="38" font-size="17" font-weight="700">Fronteira OT</text>
<text x="42" y="318" font-size="18">Perímetro → identidade e autorização → escopo e acompanhamento → segurança operacional</text>
</g><g stroke="#164e77" stroke-width="3" marker-end="url(#arrow)"><path d="M225 180h47"/><path d="M513 180h49"/><path d="M803 180h49"/></g>
</svg>
