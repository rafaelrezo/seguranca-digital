<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc"><title id="title">A08-10</title><desc id="desc">Desvio e correção → Causa confirmada → Ação corretiva → Verificar eficácia. Nova evidência pode reabrir a investigação.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="240" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><rect x="10.0" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="110.625" y="49" font-size="23" fill="#17324d" text-anchor="middle">Desvio e</text><text x="110.625" y="77" font-size="23" fill="#17324d" text-anchor="middle">correção</text><path d="M213.25 70 L231.25 70" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="236.25" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="336.875" y="49" font-size="23" fill="#17324d" text-anchor="middle">Causa</text><text x="336.875" y="77" font-size="23" fill="#17324d" text-anchor="middle">confirmada</text><path d="M439.5 70 L457.5 70" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="462.5" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="563.125" y="49" font-size="23" fill="#17324d" text-anchor="middle">Ação corretiva</text><path d="M665.75 70 L683.75 70" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="688.75" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="789.375" y="49" font-size="23" fill="#17324d" text-anchor="middle">Verificar</text><text x="789.375" y="77" font-size="23" fill="#17324d" text-anchor="middle">eficácia</text><path d="M790 125 V151 H115 V127" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#