<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc"><title id="title">A08-02</title><desc id="desc">Contexto e liderança → Planejamento e apoio → Operação → Avaliação e melhoria. Mapa funcional: a norma não impõe uma sequência única.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="240" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><rect x="10.0" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="110.625" y="49" font-size="23" fill="#17324d" text-anchor="middle">Contexto e</text><text x="110.625" y="77" font-size="23" fill="#17324d" text-anchor="middle">liderança</text><path d="M213.25 70 L231.25 70" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="236.25" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="336.875" y="49" font-size="23" fill="#17324d" text-anchor="middle">Planejamento e</text><text x="336.875" y="77" font-size="23" fill="#17324d" text-anchor="middle">apoio</text><path d="M439.5 70 L457.5 70" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="462.5" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="563.125" y="49" font-size="23" fill="#17324d" text-anchor="middle">Operação</text><path d="M665.75 70 L683.75 70" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="688.75" y="20" width="201.25" height="100" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="789.375" y="49" font-size="23" fill="#17324d" text-anchor="middle">Avaliação e</text><text x="789.375" y="77" font-size="23" fill="#17324d" text-anchor="middle">melhoria</text><text x="450" y="193" font-size="21" fill="#17324d" text-anchor="middle">Mapa funcional: a norma não impõe uma sequência única.</text></g></svg>