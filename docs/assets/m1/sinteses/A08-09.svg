<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">A08-09</title><desc id="desc">Medidas → Achados de auditoria → Mudanças do contexto → Decisões da direção. A direção considera evidências, contexto e recursos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="290" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><rect x="15" y="12" width="270" height="77" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="150.0" y="41" font-size="23" fill="#17324d" text-anchor="middle">Medidas</text><path d="M150 95 L450 145" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="315" y="12" width="270" height="77" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="450.0" y="41" font-size="23" fill="#17324d" text-anchor="middle">Achados de auditoria</text><path d="M450 95 L450 145" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="615" y="12" width="270" height="77" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="750.0" y="41" font-size="23" fill="#17324d" text-anchor="middle">Mudanças do contexto</text><path d="M750 95 L450 145" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="220" y="151" width="460" height="60" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="450.0" y="180" font-size="23" fill="#17324d" text-anchor="middle">Decisões da direção</text><text x="450" y="243" font-size="21" fill="#17324d" text-anchor="middle">A direção considera evidências, contexto e recursos.</text></g></svg>