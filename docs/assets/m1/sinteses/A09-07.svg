<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 152" role="img" aria-labelledby="title desc"><title id="title">Risco residual: revisar quando a evidência muda</title><desc id="desc">Resultado observado: Atendeu à função? → Residual: O que permanece? → Revisão: Corrigir e decidir</desc><g font-family="Arial, sans-serif"><rect x="15" y="20" width="270" height="112" rx="12" fill="#164e63"/><text x="150" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="white">Resultado observado</text><text x="150" y="99" text-anchor="middle" font-size="17" fill="white">Atendeu à função?</text><path d="M291 76h17m-7-6 7 6-7 6" fill="none" stroke="#334155" stroke-width="3"/><rect x="315" y="20" width="270" height="112" rx="12" fill="#155e75"/><text x="450" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="white">Residual</text><text x="450" y="99" text-anchor="middle" font-size="17" fill="white">O que permanece?</text><path d="M591 76h17m-7-6 7 6-7 6" fill="none" stroke="#334155" stroke-width="3"/><rect x="615" y="20" width="270" height="112" rx="12" fill="#0f766e"/><text x="750" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="white">Revisão</text><text x="750" y="99" text-anchor="middle" font-size="17" fill="white">Corrigir e decidir</text></g></svg>
