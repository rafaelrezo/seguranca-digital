<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 152" role="img" aria-labelledby="title desc"><title id="title">Evidências: distinguir proposta, implantação e resultado</title><desc id="desc">Desenho: Medida é adequada? → Implantação: Está aplicada onde? → Resultado: Atendeu ao critério?</desc><g font-family="Arial, sans-serif"><rect x="15" y="20" width="270" height="112" rx="12" fill="#164e63"/><text x="150" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="white">Desenho</text><text x="150" y="99" text-anchor="middle" font-size="17" fill="white">Medida é adequada?</text><path d="M291 76h17m-7-6 7 6-7 6" fill="none" stroke="#334155" stroke-width="3"/><rect x="315" y="20" width="270" height="112" rx="12" fill="#155e75"/><text x="450" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="white">Implantação</text><text x="450" y="99" text-anchor="middle" font-size="17" fill="white">Está aplicada onde?</text><path d="M591 76h17m-7-6 7 6-7 6" fill="none" stroke="#334155" stroke-width="3"/><rect x="615" y="20" width="270" height="112" rx="12" fill="#0f766e"/><text x="750" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="white">Resultado</text><text x="750" y="99" text-anchor="middle" font-size="17" fill="white">Atendeu ao critério?</text></g></svg>
