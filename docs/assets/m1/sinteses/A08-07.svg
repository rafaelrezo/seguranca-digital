<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">A08-07</title><desc id="desc">5 vencidas, 4 comprovadas → 1 vigente fora do cálculo. Linha de base da amostra, não medida de segurança global.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="260" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><circle cx="60" cy="70" r="32" fill="#006b68"/><text x="60" y="79" font-size="27" fill="white" text-anchor="middle">✓</text><circle cx="152" cy="70" r="32" fill="#006b68"/><text x="152" y="79" font-size="27" fill="white" text-anchor="middle">✓</text><circle cx="244" cy="70" r="32" fill="#006b68"/><text x="244" y="79" font-size="27" fill="white" text-anchor="middle">✓</text><circle cx="336" cy="70" r="32" fill="#006b68"/><text x="336" y="79" font-size="27" fill="white" text-anchor="middle">✓</text><circle cx="428" cy="70" r="32" fill="#865000"/><text x="428" y="79" font-size="27" fill="white" text-anchor="middle">?</text><text x="250" y="136" font-size="25" fill="#17324d" text-anchor="middle">5 vencidas: 4 comprovadas</text><text x="680" y="88" font-size="34" fill="#17324d" text-anchor="middle">4 ÷ 5 = 80%</text><text x="680" y="137" font-size="25" fill="#17324d" text-anchor="middle">1 vigente fica fora</text><text x="450" y="213" font-size="21" fill="#17324d" text-anchor="middle">Linha de base da amostra, não medida de segurança global.</text></g></svg>