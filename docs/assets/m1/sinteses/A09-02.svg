<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc"><title id="title">Critérios para avaliar risco</title><desc id="desc">Consequência e plausibilidade contribuem para uma avaliação justificada. A incerteza limita a conclusão.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="270" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#17324d"><rect x="60" y="15" width="330" height="65" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="225" y="55">Consequência</text><rect x="510" y="15" width="330" height="65" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="675" y="55">Plausibilidade</text><path d="M225 83 L400 128" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M675 83 L500 128" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="220" y="137" width="460" height="60" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="450" y="175">Avaliação justificada</text><text x="450" y="239" font-size="21">Declare a incerteza que pode mudar a avaliação.</text></g></svg>