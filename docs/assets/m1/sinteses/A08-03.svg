<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 265" role="img" aria-labelledby="title desc"><title id="title">A08-03</title><desc id="desc">Escopo: pedidos, portal e manutenção → Fornecedor externo. O serviço integra o escopo; a empresa fornecedora é externa.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="265" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><rect x="15" y="15" width="550" height="175" rx="12" fill="#eaf4f4" stroke="#39716f" stroke-width="3"/><text x="290" y="49" font-size="27" fill="#17324d" text-anchor="middle">Escopo do SGSI</text><text x="290" y="93" font-size="25" fill="#17324d" text-anchor="middle">Pedidos • informações • portal</text><text x="290" y="133" font-size="25" fill="#17324d" text-anchor="middle">Manutenção contratada</text><rect x="620" y="57" width="265" height="100" rx="10" fill="#fff4df" stroke="#39716f" stroke-width="2"/><text x="752.5" y="86" font-size="23" fill="#17324d" text-anchor="middle">Empresa fornecedora</text><path d="M615 109 L570 109" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="218" font-size="21" fill="#17324d" text-anchor="middle">O serviço integra o escopo; a empresa fornecedora é externa.</text></g></svg>