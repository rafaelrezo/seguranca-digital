<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">A08-08</title><desc id="desc">Pedido → Aprovação e condições → Execução → Encerramento. Decisão simulada; execução ainda exige evidência.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42566b"/></marker></defs><rect width="900" height="320" rx="12" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><rect x="12" y="12" width="205" height="95" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="114.5" y="41" font-size="23" fill="#17324d" text-anchor="middle">Pedido</text><path d="M220 59 L234 59" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="237" y="12" width="205" height="95" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="339.5" y="41" font-size="23" fill="#17324d" text-anchor="middle">Aprovação e</text><text x="339.5" y="69" font-size="23" fill="#17324d" text-anchor="middle">condições</text><path d="M445 59 L459 59" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="462" y="12" width="205" height="95" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="564.5" y="41" font-size="23" fill="#17324d" text-anchor="middle">Execução</text><path d="M670 59 L684 59" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="687" y="12" width="205" height="95" rx="10" fill="#eaf4f4" stroke="#39716f" stroke-width="2"/><text x="789.5" y="41" font-size="23" fill="#17324d" text-anchor="middle">Encerramento</text><path d="M340 111 L340 155" stroke="#42566b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="165" width="550" height="65" rx="10" fill="#fff4df" stroke="#39716f" stroke-width="2"/><text x="345.0" y="194" font-size="23" fill="#17324d" text-anchor="middle">Se faltar condição: pendente</text><text x="450" y="273" font-siz