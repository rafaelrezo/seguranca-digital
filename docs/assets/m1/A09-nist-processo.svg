<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Avaliação de riscos: preparar, conduzir, comunicar e manter</title><desc id="desc">Adaptação da Figura 5 da NIST SP 800-30 Rev. 1. Comunicação e manutenção trocam informação com a avaliação.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#36576b"/></marker></defs><rect width="1000" height="600" rx="16" fill="#f5f8fa"/><style>text{font-family:Arial,sans-serif;fill:#173345;font-size:23px}.small{font-size:18px}.head{font-weight:700;font-size:25px}.arrow{fill:none;stroke:#36576b;stroke-width:3;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style><rect x="300" y="25" width="400" height="82" rx="10" fill="#dcecf3" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="57" text-anchor="middle" class="head">Preparar</text><text x="500.0" y="86" text-anchor="middle" class="small">Finalidade • escopo • fontes • premissas</text><path class="arrow" d="M500 107V143"/><rect x="280" y="145" width="440" height="385" rx="12" fill="#e8f1f5" stroke="#8ba8b8"/><text x="500" y="180" text-anchor="middle" class="head">Conduzir a avaliação</text><rect x="302" y="200" width="396" height="51" rx="10" fill="#fff" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="232" text-anchor="middle" class="head">Fontes e eventos</text><path class="arrow" d="M500 251V261"/><rect x="302" y="263" width="396" height="51" rx="10" fill="#fff" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="295" text-anchor="middle" class="head">Vulnerabilidades e condições</text><path class="arrow" d="M500 314V324"/><rect x="302" y="326" width="396" height="51" rx="10" fill="#fff" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="358" text-anchor="middle" class="head">Verossimilhança</text><path class="arrow" d="M500 377V387"/><rect x="302" y="389" width="396" height="51" rx="10" fill="#fff" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="421" text-anchor="middle" class="head">Impacto</text><path class="arrow" d="M500 440V450"/><rect x="302" y="452" width="396" height="51" rx="10" fill="#fff" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="484" text-anchor="middle" class="head">Risco</text><rect x="20" y="281" width="230" height="116" rx="10" fill="#e6f1e9" stroke="#8ba8b8" stroke-width="2"/><text x="135.0" y="313" text-anchor="middle" class="head">Comunicar</text><text x="135.0" y="342" text-anchor="middle" class="small">Resultados, razões</text><text x="135.0" y="371" text-anchor="middle" class="small">e incertezas</text><rect x="750" y="281" width="230" height="116" rx="10" fill="#fff0d8" stroke="#8ba8b8" stroke-width="2"/><text x="865.0" y="313" text-anchor="middle" class="head">Manter</text><text x="865.0" y="342" text-anchor="middle" class="small">Monitorar fatores</text><text x="865.0" y="371" text-anchor="middle" class="small">e atualizar a avaliação</text><path class="arrow both" d="M255 340H275"/><path class="arrow both" d="M725 340H745"/><text x="500" y="570" text-anchor="middle" class="small">Adaptação em português • NIST SP 800-30 Rev. 1, Figura 5, p. 23</text></svg>