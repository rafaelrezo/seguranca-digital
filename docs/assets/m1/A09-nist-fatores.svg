<text x="1043" y="258" class="em">Grau</text>
<text x="132" y="226" class="small">com</text>
<text x="132" y="262" class="small">Características</text>
<text x="132" y="303" class="small">Capacidade, intenção</text>
<text x="132" y="333" class="small">e direcionamento</text>
<text x="132" y="363" class="small">ao alvo em ameaças</text>
<text x="132" y="393" class="small">adversariais</text>
<text x="485" y="226" class="small">com</text>
<text x="485" y="266" class="small">Sequência de</text>
<text x="485" y="301" class="body">ações, atividades</text>
<text x="485" y="334" class="body">ou cenários</text>
