<rect x="1095" y="425" width="375" height="248" rx="10" fill="#fff0d8" stroke="#7896a7" stroke-width="2"/>
<text x="1282" y="466" class="em">RISCO ORGANIZACIONAL</text>
<g style="font-size:20px"><text x="1282" y="507" class="org">Para operações organizacionais</text>
<text x="1282" y="537" class="org">(missão, funções, imagem e reputação),</text>
<text x="1282" y="567" class="org">ativos organizacionais,</text>
