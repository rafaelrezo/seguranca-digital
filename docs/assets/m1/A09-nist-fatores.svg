<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Fatores do risco e suas relações</title><desc id="desc">Fonte inicia evento; vulnerabilidades e condições influenciam a possibilidade de dano; impacto e verossimilhança fundamentam risco. Controles existentes ou planejados influenciam fatores, com eficácia e cobertura explícitas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#36576b"/></marker></defs><rect width="1000" height="510" rx="16" fill="#f5f8fa"/><style>text{font-family:Arial,sans-serif;fill:#173345;font-size:23px}.small{font-size:18px}.head{font-weight:700;font-size:25px}.arrow{fill:none;stroke:#36576b;stroke-width:3;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style><rect x="25" y="35" width="250" height="120" rx="10" fill="#dcecf3" stroke="#8ba8b8" stroke-width="2"/><text x="150.0" y="67" text-anchor="middle" class="head">Fonte de ameaça</text><text x="150.0" y="96" text-anchor="middle" class="small">Capacidade, intenção, alvo</text><text x="150.0" y="125" text-anchor="middle" class="small">ou erro, falha e acidente</text><rect x="375" y="35" width="250" height="120" rx="10" fill="#fff" stroke="#8ba8b8" stroke-width="2"/><text x="500.0" y="67" text-anchor="middle" class="head">Evento</text><text x="500.0" y="96" text-anchor="middle" class="small">Ação ou ocorrência</text><text x="500.0" y="125" text-anchor="middle" class="small">que pode causar dano</text><rect x="725" y="35" width="250" height="120" rx="10" fill="#fff0d8" stroke="#8ba8b8" stroke-width="2"/><text x="850.0" y="67" text-anchor="middle" class="head">Impacto</text><text x="850.0" y="96" text-anchor="middle" class="small">Dano ao trabalho,</text><text x="850.0" y="125" text-anchor="middle" class="small">aos dados ou às pessoas</text><path class="arrow" d="M275 95H365"/><text x="325" y="80" text-anchor="middle" class="small">inicia</text><path class="arrow" d="M625 95H715"/><text x="675" y="67" text-anchor="middle" class="small">pode</text><text x="675" y="87" text-anchor="middle" class="small">causar</text><rect x="340" y="214" width="350" height="120" rx="10" fill="#e8f1f5" stroke="#8ba8b8" stroke-width="2"/><text x="515.0" y="246" text-anchor="middle" class="head" style="font-size:22px">Vulnerabilidades e condições</text><text x="515.0" y="275" text-anchor="middle" class="small">Fragilidades e exposição</text><text x="515.0" y="304" text-anchor="middle" class="small">influenciam o caminho</text><path class="arrow" d="M590 214L672 120"/><rect x="25" y="238" width="265" height="120" rx="10" fill="#e6f1e9" stroke="#8ba8b8" stroke-width="2"/><text x="157.5" y="270" text-anchor="middle" class="head">Controles</text><text x="157.5" y="299" text-anchor="middle" class="small">Existentes ou planejados</text><text x="157.5" y="328" text-anchor="middle" class="small">Eficácia e cobertura</text><path class="arrow" d="M290 275H330"/><rect x="725" y="250" width="250" height="90" rx="10" fill="#fff0d8" stroke="#8ba8b8" stroke-width="2"/><text x="850.0" y="282" text-anchor="middle" class="head">Risco</text><text x="850.0" y="311" text-anchor="middle" class="small">Verossimilhança e impacto</text><path class="arrow" d="M850 155V240"/><text x="500" y="405" text-anchor="middle">A preparação define critérios e premissas para avaliar os fatores.</text><text x="500" y="440" text-anchor="middle" class="small">Controle planejado e controle eficaz representam estados diferentes.</text><text x="500" y="480" text-anchor="middle" class="small">Adaptação simplificada • NIST SP 800-30 Rev. 1, Figura 3, p. 12</text></svg>