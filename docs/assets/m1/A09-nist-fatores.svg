<text x="345" y="549" class="small">Estratégia ou abordagem de gestão de riscos</text>
<text x="345" y="606" class="body">Influenciam e podem modificar</text>
<text x="345" y="642" class="body">os principais fatores de risco.</text>
<text x="750" y="765" class="em">MODELO GENÉRICO DE RISCO COM OS PRINCIPAIS FATORES</text>
