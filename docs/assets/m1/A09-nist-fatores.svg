<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Figura 3 — Modelo genérico de risco com os principais fatores de risco</title>
<desc id="desc">Tradução e redesenho da Figura 3 da NIST SP 800-30 Rev. 1, página 12. Uma fonte de ameaça, com características como capacidade, intenção e direcionamento, inicia um evento com verossimilhança de iniciação. O evento, composto por ações, atividades ou cenários, explora uma vulnerabilidade com verossimilhança de sucesso. A vulnerabilidade tem severidade e está no contexto de condições predisponentes, com abrangência, e de controles planejados ou implantados, com eficácia. O encadeamento causa impacto adverso com determinado grau. Risco combina impacto e verossimilhança, produzindo risco organizacional. Entradas do enquadramento de risco influenciam e podem modificar os principais fatores.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315970"/></marker></defs>
